image: Ubuntu2204

environment:
  SITE_REPO_TOKEN: 
    secure: 9J4+3PqRqzTDiC280JthRE4EVP8YqK67eEDJmyD+2s+j8H/R5TyrJJJNnpOejxCH

branches:
  only:
    - develop   
    
install:
- sh: sudo rm -rf /var/lib/apt/lists/*
- sh: sudo apt-key adv --refresh-keys --keyserver keyserver.ubuntu.com
- sh: sudo apt-get update
- sh: sudo apt-get -y install curl
- sh: sudo apt-get -y install imagemagick
- sh: sudo apt-get -y install webp
- sh: sudo apt-get -y install libvips
- sh: sudo apt-get install gnupg2 -y
- sh: sudo gpg --keyserver hkp://keyserver.ubuntu.com --recv-keys 409B6B1796C275462A1703113804BB82D39DC0E3 7D2BAF1CF37B13E2069D6956105BD0E739499BDB
- sh: \curl -sSL https://rvm.io/mpapis.asc | gpg2 --import -
- sh: \curl -sSL https://rvm.io/pkuczynski.asc | gpg2 --import -
- sh: sudo rm -f /usr/bin/rvm
- sh: \curl -L https://get.rvm.io | bash
- sh: source ~/.rvm/scripts/rvm
- sh: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
- sh: (echo; echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"') >> /home/appveyor/.bashrc
- sh: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
- sh: brew install openssl@3
- sh: rvm get stable
- sh: sudo apt-get install -y --fix-missing ruby-full build-essential zlib1g-dev
- sh: |
    echo '# Install Ruby Gems to ~/gems' >> ~/.bashrc
    echo 'export GEM_HOME="$HOME/gems"' >> ~/.bashrc
    echo 'export PATH="$HOME/gems/bin:$PATH"' >> ~/.bashrc
    source ~/.bashrc
- sh: rbenv global 2.7.8
- sh: rbenv rehash
- sh: sudo gem install jekyll bundler

build_script:
- sh: cd src
- sh: bundle install
- sh: git config --global credential.helper "store --file ~/.git-credentials"
- ps: git config --global user.email $env:APPVEYOR_REPO_COMMIT_AUTHOR_EMAIL
- ps: git config --global user.name $env:APPVEYOR_REPO_COMMIT_AUTHOR
- ps: Add-Content "~/.git-credentials" "https://$($env:SITE_REPO_TOKEN):x-oauth-basic@github.com"
- ps: git clone https://github.com/giacomelli/giacomelli.github.io.git _site
- sh: cd ..
- sh: ./generate-bundle.sh
- sh: cd src
- sh: bundle exec jekyll build
- sh: cp ../CNAME _site/CNAME
- ps: echo ".nojekyll" > _site/.nojekyll
- ps: | 
      cd _site
      echo "{ `"date`": `"$(Get-Date -Format g)`", `"branch`": `"$($env:APPVEYOR_REPO_BRANCH)`" }" > version.json
      git add .
      git commit -m "$($env:APPVEYOR_REPO_COMMIT_MESSAGE)"
      git push